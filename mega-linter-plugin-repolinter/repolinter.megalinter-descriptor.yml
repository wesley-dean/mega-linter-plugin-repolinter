---
descriptor_id: "REPOLINTER"
descriptor_type: "other"
descriptor_flavors:
  - "all_flavors"
  - "ci_light"
  - "security"
lint_all_files: true
linters:
  - linter_name: "repolinter"
    name: "REPOSITORY_REPOLINTER"
    linter_repo: "https://github.com/wesley-dean/mega-linter-plugin-repolinter"
    linter_url: "https://github.com/todogroup/repolinter"
    config_file_name: "repolinter.json"
    cli_executable: "repolinter"
    cli_help_arg_name: "--help"
    cli_version_arg_name: "--version"
    cli_lint_fix_remove_args:
      - "--dryRun"
    cli_lint_mode: "project"
    supported_cli_lint_modes:
      - "project"
    cli_lint_extra_args:
      - "lint"
      - "--dryRun"
      - "--format=console"
    cli_lint_errors_count: "regex_count"
    cli_lint_warnings_count: "regex_count"
    cli_lint_warnings_regex: "(?m)^⚠️"
    cli_lint_errors_regex: "(?m)^✖ "
    examples:
      - "repolinter lint --dryRun --format=console ."
      - "repolinter lint --dryRun --format=console --rulesetFile=rules.json ."
    linter_rules_url: "https://github.com/todogroup/repolinter/blob/main/docs/rules.md"
    version_extract_regex: "\\d+(?:\\.\\d+){2}"
    install:
      dockerfile:
        - "RUN npm install --global repolinter@0.12.0"
